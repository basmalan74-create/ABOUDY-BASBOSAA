<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">

<style>
:root{--p:#f7d6dc;--p2:#fbe9ec;--c:#fff8ef;--b:#7a1f3d;--b2:#a63a5c;--w:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(160deg,var(--c),var(--p2) 60%,var(--p));min-height:100%;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;color:var(--b)}
#app{max-width:480px;margin:auto;padding:16px 16px 40px;min-height:100vh}
h1{font-size:26px;margin:8px 0;text-align:center}h2{font-size:21px;margin:6px 0 12px;text-align:center}
.sub{text-align:center;color:var(--b2);margin:0 0 18px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--w);border-radius:22px;padding:18px;box-shadow:0 8px 24px #7a1f3d1f;margin-bottom:14px;animation:pop .35s ease}
.big{font-size:20px;line-height:1.8;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center}
button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:14px 10px;background:var(--w);color:var(--b);box-shadow:0 5px 14px #7a1f3d22;transition:transform .15s;font-weight:600}
button:active{transform:scale(.95)}
.m{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;padding:18px 8px}.m span{font-size:30px}
.pri{background:linear-gradient(135deg,var(--b2),var(--b));color:#fff;width:100%;margin-top:8px}
.soft{background:var(--p);width:100%;margin-top:8px}
.opt{width:100%;margin:6px 0;border:2px solid var(--p)}.opt.sel{background:var(--b);color:#fff}
.row{display:flex;gap:8px}.row button{flex:1}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.back{padding:8px 14px;font-size:14px}
.bar{height:8px;background:var(--p);border-radius:9px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--b2);transition:width .4s}
input,textarea,select{width:100%;font:inherit;padding:12px;border:2px solid var(--p);border-radius:14px;margin:6px 0;background:var(--c);color:var(--b)}
.chip{display:inline-block;margin:4px;padding:8px 12px;border-radius:99px;background:var(--p);font-size:14px;cursor:pointer}.chip.on{background:var(--b);color:#fff}
.miss{font-size:22px;padding:34px 10px;width:100%;background:linear-gradient(135deg,#e0607f,var(--b));color:#fff;animation:beat 1.6s infinite}
.note{font-size:13px;background:#fff3cd;color:#6b4e00;border-radius:14px;padding:10px;line-height:1.7;margin:8px 0}
.item{background:var(--p2);border-radius:14px;padding:10px 12px;margin:6px 0;line-height:1.7;font-size:15px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--b);color:#fff;padding:12px 18px;border-radius:99px;font-size:14px;z-index:9;max-width:90%;text-align:center;animation:pop .3s}
.fl{position:fixed;font-size:26px;pointer-events:none;animation:up 1.6s forwards;z-index:8}
.ok{color:#1b7a4b}.sm{font-size:13px;color:var(--b2)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}to{opacity:1;transform:none}}
@keyframes beat{50%{transform:scale(1.03)}}
@keyframes up{to{transform:translateY(-220px);opacity:0}}
</style></head><body><div id="app"></div>

app.innerHTML=hd("🌙 موعدنا أونلاين")+(d?`<div class="card">${c}<div class="item">${new Date(d.when).toLocaleString("ar-EG")}<br>${d.ideas.join(" • ")||"من غير خطة 😄"}</div></div>`:"")+`<div class="card"><b>ناويين نعمل إيه؟</b><div id="ch">${IDEAS.map(x=>`<span class="chip" onclick="this.classList.toggle('on')">${x}</span>`).join("")}</div><input type="datetime-local" id="dw"><button class="pri" onclick="saveD()">احفظي الموعد 🌙</button><div class="sm">التذكير الفعلي لعبودي محتاج إشعارات من الباك إند.</div></div>`},
mem(){app.innerHTML=hd("📸 ذكرياتنا")+`<div class="card"><input id="mt" placeholder="عنوان الذكرى"><textarea id="mb" rows="2" placeholder="احكي اللي حصل…"></textarea><input type="date" id="md"><input type="file" id="mf" accept="image/*"><button class="pri" onclick="addM()">احفظي الذكرى 📸</button><div class="sm">الصور بتتصغّر وتتحفظ على جهازك بس.</div></div>`+Store.d.mem.map((m,i)=>`<div class="card"><b>${m.t}</b> <span class="sm">${m.d||""}</span><div style="margin:6px 0">${m.b}</div>${m.img?`<img src="${m.img}" style="width:100%;border-radius:14px;margin-bottom:8px">`:""}<button class="back" onclick="Store.d.mem.splice(${i},1);Store.save();go('mem')">🗑️ حذف</button></div>`).join("")}};
function openS(){const b=$("#sb");b.style.fontSize="20px";b.textContent=sh(SURP)[0];hearts(12)}
function addL(){const t=$("#lt").value.trim(),b=$("#lb").value.trim();if(!t||!b)return toast("اكتبي العنوان والرسالة 🌸");Store.d.letters.push([t,b]);Store.save();go("letters")}
function saveD(){const w=$("#dw").value;if(!w)return toast("اختاري الميعاد الأول 🌙");Store.d.date={when:w,ideas:[...document.querySelectorAll(".chip.on")].map(c=>c.textContent)};Store.save();hearts(8);go("date")}
async function addM(){const t=$("#mt").value.trim(),b=$("#mb").value.trim();if(!t)return toast("اكتبي عنوان للذكرى 🌸");let img="";const f=$("#mf").files[0];if(f)img=await rs(f);Store.d.mem.unshift({t,b,d:$("#md").value,img});Store.save();hearts(8);go("mem")}
function rs(f,mx=640,q=.6){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,mx/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};im.onerror=()=>res("");im.src=r.result};r.readAsDataURL(f)})}
function shr(t){const x=t.replace(/<br>/g,"\n").replace(/<[^>]+>/g,"");if(navigator.share)navigator.share({text:x}).catch(()=>{});else{try{navigator.clipboard.writeText(x);toast("اتنسخت 💗 ابعتيها بأي تطبيق")}catch(e){toast("انسخي الرسالة يدويًا")}}}
function openW(i){const w=WHEN[i];Store.d.opened=[...new Set([...(Store.d.opened||[]),i])];Store.save();hearts(14);app.innerHTML=hd("افتحها لما "+w[0],"when")+`<div class="card big" style="font-size:19px;flex-direction:column">${w[2]}</div><button class="pri" onclick="shr(WHEN[${i}][2])">📤 ابعتيها لحد</button>`}
// ===== محرك الألعاب =====
function play(k){const D=k==="dare"?null:DECKS[k];let items=k==="dare"?DARES:D.items;items=sh(items).slice(0,k==="dare"?20:Math.min(D.n,items.length));G={k,items,i:0,score:0,ph:0,tally:{},pick:null,done:0};draw()}
function draw(){const g=G,k=g.k;if(g.i>=g.items.length)return end();const it=g.items[g.i],D=DECKS[k];
const title=k==="dare"?"😂 حكم الخسران":D.e+" "+D.t;let body="",q="";
if(k==="dare"){q=it;body=`<div class="row"><button class="pri" onclick="nx(1)">✅ اتنفذ</button><button class="soft" onclick="nx(0)">⏭️ تخطي</button></div>`}
else if(k==="know"||k==="either"){q=k==="know"?it[0]:"أنهي أحسن؟";const o=k==="know"?it[1]:it;
if(g.ph===0)body=o.map(x=>`<button class="opt" onclick="pk(this.dataset.v)" data-v="${x}">${x}</button>`).join("")+skip();
else{q+=`<br><span class="sm">اختيار: ${g.pick}</span>`;body=`<p class="sub">${k==="know"?"الطرف التاني: التخمين صح؟":"اتفقنا؟"}</p><div class="row"><button class="pri" onclick="nx(1)">${k==="know"?"✅ صح":"😍 اتفقنا"}</button><button class="soft" onclick="nx(0)">${k==="know"?"❌ غلط":"😂 اختلفنا"}</button></div>`}}
else if(k==="who"){q=it[0];body=["أنا 🙋‍♀️","إنت 🙋‍♂️","إحنا الاتنين 🤝"].map(x=>`<button class="opt" onclick="G.tally['${x}']=(G.tally['${x}']||0)+1;nx(0)">${x}</button>`).join("")+skip()}
else{q=(it[0]?`<span class="chip on">${it[0]}</span><br>`:"")+(it[1]||it[0]);if(k==="iff")q=it[0];body=`<button class="pri" onclick="nx(0)">التالي ➡️</button><button class="soft" onclick="nx(0)">⏭️ نتخطى براحتنا</button><button class="soft" onclick="end()">🏁 كفاية كده</button>`}
const total=g.items.length;
app.innerHTML=`<div class="top"><button class="back" onclick="go('${k==="talk"||k==="dare"?"home":"games"}')">→ خروج</button><span class="sm">${g.i+1} / ${total}</span></div><h2>${title}</h2><div class="bar"><i style="width:${g.i/total*100}%"></i></div><div class="card big">${q}</div>${body}`}
function skip(){return `<button class="soft" onclick="nx(0,1)">⏭️ تخطي من غير ضغط</button>`}
function pk(v){G.pick=v;G.ph=1;draw()}
function nx(s,sk){G.score+=s;if(s&&G.k==="dare")G.done++;G.i++;G.ph=0;G.pick=null;if(s)hearts(5);draw()}
function end(){const g=G,k=g.k;let msg,big;
if(k==="who"){const t=Object.entries(g.tally).sort((a,b)=>b[1]-a[1]);big="🤭";msg=t.length?"الأكتر: "+t[0][0]+" ("+t[0][1]+" مرة)<br>"+t.map(x=>x[0]+": "+x[1]).join(" • "):"لعبنا من غير ما نحسب 😄"}
else if(k==="know"||k==="either"){const n=g.items.length;big=g.score>=n*.7?"🥰":g.score>=n*.4?"😄":"😂";msg=`النتيجة: ${g.score} من ${n}<br>`+(g.score>=n*.7?"إنتم فاهمين بعض أوي 💗":g.score>=n*.4?"حلو! لسه فيه حاجات نكتشفها 🌸":"لازم نتكلم أكتر 😂💗");const b=Store.d.best[k];if(b==null||g.score>b){Store.d.best[k]=g.score;Store.save()}}
else if(k==="dare"){big="😂";msg=`نفّذنا ${g.done} تحدي!<br>الخسران اتعاقب بحب 💗`}
else{big="💗";msg="كلام حلو النهارده، شكرًا إنك فتحت قلبك 🌸"}
hearts(16);app.innerHTML=`<h2>خلصنا! ${big}</h2><div class="card big" style="font-size:19px">${msg}</div><button class="pri" onclick="play('${k}')">🔁 نلعب تاني</button><button class="soft" onclick="go('${k==="talk"||k==="dare"?"home":"games"}')">رجوع</button>`}
